<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 44px; overflow: hidden; user-select: none; -webkit-user-select: none; }
body {
  font-family: 'Inter', -apple-system, sans-serif;
  background: #ffffff;
  color: #0F172A;
  display: flex;
  align-items: center;
  height: 44px;
  border-bottom: 2px solid #1A6BF5;
  -webkit-app-region: no-drag;
}

/* ── BRAND ── */
.brand {
  display: flex; align-items: center; gap: 8px;
  padding: 0 16px; border-right: 1px solid #E2E8F0;
  height: 100%; flex-shrink: 0; cursor: pointer; transition: background .15s;
}
.brand:hover { background: #F8FAFC; }
.brand-icon {
  width: 26px; height: 26px; background: #1A6BF5; border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; color: #fff; flex-shrink: 0;
}
.brand-name { font-size: 14px; font-weight: 700; color: #0F172A; letter-spacing: -.4px; white-space: nowrap; }
.brand-name span { color: #1A6BF5; }

/* ── SEARCH ── */
.search-zone {
  display: flex; align-items: center; gap: 6px;
  padding: 0 12px; border-right: 1px solid #E2E8F0;
  height: 100%; flex-shrink: 0;
}
#search-input {
  background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 7px;
  color: #0F172A; font-size: 12px; font-family: 'Inter', sans-serif;
  padding: 5px 10px; width: 110px; outline: none; transition: border-color .15s, box-shadow .15s;
}
#search-input:focus { border-color: #1A6BF5; box-shadow: 0 0 0 3px rgba(26,107,245,.12); background: #fff; }
#search-input::placeholder { color: #64748B; }
.search-btn {
  background: #1A6BF5; border: none; border-radius: 7px; color: #fff;
  font-size: 12px; font-weight: 600; font-family: 'Inter', sans-serif;
  padding: 5px 12px; cursor: pointer; white-space: nowrap; transition: background .15s;
}
.search-btn:hover { background: #1558D6; }

/* ── TICKER TAPE ── */
.ticker-viewport {
  flex: 1; overflow: hidden; position: relative; height: 100%;
  mask-image: linear-gradient(to right, transparent 0%, black 1.5%, black 98.5%, transparent 100%);
  -webkit-mask-image: linear-gradient(to right, transparent 0%, black 1.5%, black 98.5%, transparent 100%);
}
.ticker-tape {
  display: flex; position: absolute; left: 0; top: 0;
  height: 100%; align-items: center; white-space: nowrap; will-change: transform;
}
.tick-item {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 0 16px; height: 100%; cursor: pointer;
  border-right: 1px solid #F1F5F9; transition: background .1s; flex-shrink: 0;
}
.tick-item:hover { background: #EFF6FF; }
.tick-item:hover .tick-sym { color: #1A6BF5; }
.tick-sym { font-size: 12px; font-weight: 700; color: #0F172A; letter-spacing: .01em; transition: color .1s; }
.tick-price { font-size: 12px; color: #475569; font-family: 'JetBrains Mono', monospace; }
.tick-chg { font-size: 11px; font-weight: 600; font-family: 'JetBrains Mono', monospace; }
.tick-chg.up  { color: #16A34A; }
.tick-chg.dn  { color: #DC2626; }
.tick-chg.flat { color: #94A3B8; }

/* ── AD ZONE ── */
.ad-zone {
  width: 280px; height: 100%; flex-shrink: 0;
  border-left: 1px solid #E2E8F0; position: relative; overflow: hidden;
  background: #FAFBFF; cursor: pointer;
}
.ad-slide {
  position: absolute; inset: 0; display: flex; align-items: center;
  gap: 10px; padding: 0 14px;
  opacity: 0; transition: opacity .6s ease;
}
.ad-slide.active { opacity: 1; }
.ad-slide:hover { background: #EFF6FF; }

/* Ad logo badge */

.ad-logo-badge {
  width: auto; min-width: 44px; height: 26px; border-radius: 5px; padding: 0 8px;

}
.ad-body { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
.ad-headline { font-size: 12px; font-weight: 600; color: #0F172A; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ad-sub { font-size: 10px; color: #475569; white-space: nowrap; }
.ad-cta {
  font-size: 10px; font-weight: 700; padding: 3px 9px;
  border-radius: 6px; white-space: nowrap; flex-shrink: 0;

.ad-cta:hover { background: #1558D6; }

/* ── EXIT BUTTON ── */

.alert-banner {

// ── AD TARGETING ENGINE ────────────────────────────────────────────────────────
function classifyTickers(tickerList) {
  const counts = { crypto:0, energy:0, tech:0, financials:0, metals:0, healthcare:0 };
  tickerList.forEach(function(sym) {
    for (var cat in SYMBOL_CATEGORIES) {
      if (SYMBOL_CATEGORIES[cat].indexOf(sym.toUpperCase()) >= 0) {
        counts[cat]++;
      }
    }
  });
  // Find dominant category (must be >30% of portfolio to qualify)
  var total = tickerList.length;
  var dominant = 'default';
  var maxCount = 0;
  for (var cat in counts) {
    if (counts[cat] > maxCount && counts[cat] / total >= 0.3) {
      maxCount = counts[cat];
      dominant = cat;
    }
  }
  return { dominant: dominant, counts: counts };
}

function selectAds(tickerList) {
  var profile = classifyTickers(tickerList);
  var pool = AD_POOLS[profile.dominant] || AD_POOLS.default;
  // Always mix in at least one default ad
  if (profile.dominant !== 'default' && pool.length < 3) {
    pool = pool.concat(AD_POOLS.default.slice(0, 2));
  }
  console.log('Ad targeting: dominant=' + profile.dominant, 'counts=', profile.counts);
  return pool;
}

function getSymbolColor(sym) {
  var s = sym.toUpperCase();
  if (CRYPTO_MAP[s])           return '#F59E0B'; // amber — crypto
  if (COMMODITY_SYMS.indexOf(s) >= 0) return '#D97706'; // gold — commodities
  if (FUTURES_SYMS.indexOf(s) >= 0)   return '#7C3AED'; // purple — futures
  if (ETF_SYMS.indexOf(s) >= 0)       return '#2563EB'; // blue — ETFs
  return '#0F172A'; // default — stocks
}

async function fetchCryptoQuotes(cryptoSymbols) {
  if (!cryptoSymbols.length) return {};
  try {
    const ids = cryptoSymbols.map(function(s){ return CRYPTO_MAP[s]; }).filter(Boolean).join(',');
    if (!ids) return {};
    const r = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=' + ids + '&vs_currencies=usd&include_24hr_change=true');
    const data = await r.json();
    const result = {};
    cryptoSymbols.forEach(function(sym) {
      const id = CRYPTO_MAP[sym];
      if (id && data[id] && data[id].usd) {
        result[sym] = {
          price: data[id].usd,
          changePct: data[id].usd_24h_change || 0,
          change: 0,
          isCrypto: true,
        };
      }
    });
    return result;
  } catch(e) {
    console.warn('CoinGecko fetch error:', e.message);
    return {};
  }
}

    logo.textContent = ad.abbr;

    // Message body
    const body = document.createElement('div');
    body.style.cssText = 'flex:1;display:flex;flex-direction:column;justify-content:center;gap:1px;min-width:0;';
    body.innerHTML =
      '<span style="font-size:9px;font-weight:700;color:' + ad.color + ';text-transform:uppercase;letter-spacing:.08em;white-space:nowrap;">' + ad.name + '</span>' +
      '<span style="font-size:12px;font-weight:700;color:#0F172A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25;">' + ad.hl + '</span>' +
      '<span style="font-size:10px;color:#64748B;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25;">' + ad.sub + '</span>';

    div.appendChild(logo);
    div.appendChild(body);
    div.addEventListener('click', handleAdClick);
    div.style.pointerEvents = (i === 0) ? 'auto' : 'none';
    zone.appendChild(div);
  });
}

function rotateAd() {
  const slides = document.querySelectorAll('.ad-slide');
  if (!slides.length) return;
  slides[adIndex].classList.remove('active');
  adIndex = (adIndex + 1) % ads.length;
  slides[adIndex].classList.add('active');
  // Only active slide receives pointer events
  document.querySelectorAll('.ad-slide').forEach(function(s) {
    s.style.pointerEvents = s.classList.contains('active') ? 'auto' : 'none';
  });
}

function handleAdClick(e) {
  // Always use the currently active slide's URL
  const active = document.querySelector('.ad-slide.active');
  if (!active) return;
  const url = active.dataset.url;
  if (!url) return;
  if (window.pulseAPI) window.pulseAPI.openExternal(url);
  else window.open(url, '_blank');
}

// ── TICKER TAPE ────────────────────────────────────────────────────────────────
function buildTape(forceReset) {
  const tape = document.getElementById('ticker-tape');
  const savedPx = forceReset ? 0 : tapePx;
  const items = [...tickers, ...tickers, ...tickers].map(t => buildTickItem(t)).join('');
  tape.innerHTML = items;
  // Only reset position if forced (ticker list changed) — otherwise preserve scroll
  if (forceReset) {
    tapePx = 0;
    tape.style.transform = 'translateX(0px)';
  }
}

function buildTickItem(ticker) {
  const q = quotes[ticker];
  let price = '—', chgStr = '—', cls = 'flat';
  if (q) {
    price = '$' + q.price.toFixed(2);
    const pct = q.changePct;
    if (pct > 0)      { chgStr = '▲ +' + pct.toFixed(2) + '%'; cls = 'up'; }
    else if (pct < 0) { chgStr = '▼ '  + pct.toFixed(2) + '%'; cls = 'dn'; }
    else              { chgStr = '0.00%'; }
  }
  var newsDot = tickerNews[ticker] ? '<span class="news-dot" title="News available"></span>' : '';
  var symColor = getSymbolColor(ticker);
  return '<div class="tick-item" data-ticker="' + ticker + '" onclick="openStock(\'' + ticker + '\')" title="Analyze ' + ticker + ' on PulseStock">'
    + newsDot
    + '<span class="tick-sym" style="color:' + symColor + '">' + ticker + '</span>'
    + '<span class="tick-price">' + price + '</span>'
    + '<span class="tick-chg ' + cls + '">' + chgStr + '</span>'
    + '</div>';
}

function animateTape() {
  const tape = document.getElementById('ticker-tape');
  if (!tape) return;
  tapePx -= tapeSpeed;
  const items = tape.children;
  if (items.length > 0) {
    const oneSetWidth = items[0].offsetWidth * tickers.length;
    if (Math.abs(tapePx) >= oneSetWidth) tapePx += oneSetWidth;
  }
  tape.style.transform = `translateX(${tapePx}px)`;
  rafId = requestAnimationFrame(animateTape);
}

// ── QUOTES ─────────────────────────────────────────────────────────────────────
async function fetchQuotes() {
  try {
    // Split tickers into crypto (CoinGecko) and stocks (Finnhub)
    var cryptoSyms = tickers.filter(function(t){ return CRYPTO_MAP[t.toUpperCase()]; });
    var stockSyms  = tickers.filter(function(t){ return !CRYPTO_MAP[t.toUpperCase()]; });

    // Fetch stocks from Finnhub — keep last known quotes if rate limited
    var stockResults = await Promise.all(stockSyms.map(function(t) {
      return fetch('https://finnhub.io/api/v1/quote?symbol=' + encodeURIComponent(t) + '&token=' + FINNHUB_KEY)
        .then(function(r){ return r.json(); })
        .then(function(d) {
          return [t, (d && d.c && d.c > 0) ? { price: d.c, changePct: d.dp, change: d.d } : null];
        })
        .catch(function() { return [t, null]; });
    }));

    // Fetch crypto from CoinGecko (free, real prices)
    var cryptoData = await fetchCryptoQuotes(cryptoSyms.map(function(s){ return s.toUpperCase(); }));

    // Keep last known quotes — only update symbols that returned fresh data
    stockResults.forEach(function(pair) { if (pair[1]) quotes[pair[0]] = pair[1]; });
    Object.assign(quotes, cryptoData);
    // Update tick items in place — don't reset scroll position
    updateTapeQuotes();
  } catch(e) {
    console.error('Quote fetch error:', e);
  }
}

// ── NAVIGATION ─────────────────────────────────────────────────────────────────
// Update tape quotes without resetting scroll position
function updateTapeQuotes() {
  var items = document.querySelectorAll('.tick-item');
  if (!items.length) { buildTape(true); return; }
  items.forEach(function(item) {
    var ticker = item.dataset.ticker;
    if (!ticker) return;
    var q = quotes[ticker];
    var price = '—', chgStr = '—', cls = 'flat';
    if (q) {
      price = '$' + q.price.toFixed(2);
      var pct = q.changePct;
      if (pct > 0)      { chgStr = '▲ +' + pct.toFixed(2) + '%'; cls = 'up'; }
      else if (pct < 0) { chgStr = '▼ '  + pct.toFixed(2) + '%'; cls = 'dn'; }
      else              { chgStr = '0.00%'; }
    }
    var priceEl = item.querySelector('.tick-price');
    var chgEl   = item.querySelector('.tick-chg');
    if (priceEl) priceEl.textContent = price;
    if (chgEl)   { chgEl.textContent = chgStr; chgEl.className = 'tick-chg ' + cls; }
  });
}

function openStock(ticker) {
  const t = ticker.trim().toUpperCase();
  const url = 'https://pulsestock-nu.vercel.app/?ticker=' + t;
  if (window.pulseAPI) window.pulseAPI.openExternal(url);
  else window.open(url, '_blank');
}

function doSearch() {
  const input = document.getElementById('search-input');
  const ticker = input.value.trim().toUpperCase().replace(/[^A-Z0-9.-]/g, '');
  if (!ticker) return;
  // Open directly — no Finnhub fetch needed, PulseStock handles it
  const url = 'https://pulsestock-nu.vercel.app/?ticker=' + ticker;
  if (window.pulseAPI) window.pulseAPI.openExternal(url);
  else window.open(url, '_blank');
  input.value = '';
  document.getElementById('search-input').blur();
}

document.getElementById('brand-btn').addEventListener('click', () => {
  const url = 'https://pulsestock-nu.vercel.app';
  if (window.pulseAPI) window.pulseAPI.openExternal(url);
  else window.open(url, '_blank');
});

// ── SETTINGS ───────────────────────────────────────────────────────────────────
function renderPrefsList() {
  var list = document.getElementById('prefs-list');
  if (!list) return;
  list.innerHTML = '';
  tickerPrefs.forEach(function(pref, idx) {
    var row = document.createElement('div');
    row.className = 'pref-row';
    row.innerHTML =
      '<span class="pref-sym">' + pref.sym + '</span>' +
      '<label class="pref-check">' +
        '<input type="checkbox" ' + (pref.news ? 'checked' : '') + ' onchange="toggleNews(' + idx + ', this.checked)" />' +
        '🔴 News alerts' +
      '</label>' +
      '<span class="pref-remove" onclick="removeTicker(' + idx + ')" title="Remove">✕</span>';
    list.appendChild(row);
  });
}

function toggleNews(idx, val) {
  if (tickerPrefs[idx]) tickerPrefs[idx].news = val;
}

function addTicker() {
  var input = document.getElementById('add-ticker-input');
  var sym = input.value.trim().toUpperCase().replace(/[^A-Z0-9.\-]/g, '');
  if (!sym) return;
  if (tickerPrefs.find(function(p){ return p.sym === sym; })) {
    input.value = '';
    return;
  }
  // Add with prefs prompt
  tickerPrefs.push({ sym: sym, news: true }); // default news ON for new symbols
  input.value = '';
  renderPrefsList();
}

function removeTicker(idx) {
  tickerPrefs.splice(idx, 1);
  renderPrefsList();
}

function openSettingsWindow() {
  if (window.pulseAPI) window.pulseAPI.openSettingsWindow();
}

function openSettings() {
  renderPrefsList();
  var slider = document.getElementById('speed-slider');
  if (slider) {
    slider.value = tapeSpeed;
    document.getElementById('speed-label').textContent = tapeSpeed.toFixed(1) + 'x';
    slider.oninput = function() {
      document.getElementById('speed-label').textContent = parseFloat(this.value).toFixed(1) + 'x';
    };
  }
  document.getElementById('settings-overlay').classList.add('open');
}
function closeSettings() {
  document.getElementById('settings-overlay').classList.remove('open');
}
async function saveSettings() {
  if (!tickerPrefs.length) return alert('Add at least one ticker.');
  tickers = tickerPrefs.map(function(p){ return p.sym; });
  var slider = document.getElementById('speed-slider');
  if (slider) tapeSpeed = parseFloat(slider.value);
  if (window.pulseAPI) await window.pulseAPI.saveSettings({ tickers: tickers, speed: tapeSpeed });
  // Re-target ads based on new ticker composition
  ads = selectAds(tickers);
  buildAdZone();
  adIndex = 0;
  closeSettings();
  // Re-fetch news for any new symbols with news enabled
  await fetchTickerNews();
  await fetchQuotes();
  buildTape(true); // force reset on ticker change
}

document.addEventListener('contextmenu', e => {
  if (e.target.closest('.tick-item') || e.target.closest('.brand')) {
    e.preventDefault(); openSettings();
  }
});
document.getElementById('brand-btn').addEventListener('contextmenu', e => {
  e.preventDefault(); openSettings();
});
window.pulseAPI?.onOpenSettings(() => openSettings());

// Listen for prefs updates from settings window
window.pulseAPI?.onUpdateTickerPrefs(function(saved) {
  if (!saved) return;
  tickerPrefs = saved.prefs || tickerPrefs;
  tickers = tickerPrefs.map(function(p){ return p.sym; });
  if (saved.speed) tapeSpeed = saved.speed;
  fetchTickerNews();
  fetchQuotes();
});

// Live ticker update from main process (after login/sync)
window.pulseAPI?.onUpdateTickers(async (newTickers) => {
  if (newTickers?.length) {
    tickers = newTickers;
    await fetchQuotes();
    buildTape();
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeSettings();
  if ((e.metaKey || e.ctrlKey) && e.key === ',') openSettings();
});

// ── INIT ───────────────────────────────────────────────────────────────────────
// ── NEWS FUNCTIONS ─────────────────────────────────────────────────────────────
async function fetchTickerNews() {
  try {
    // Only fetch for tickers that have news alerts enabled
    var newsEnabled = tickerPrefs.filter(function(p){ return p.news; });
    if (!newsEnabled.length) { buildTape(); return; }
    var results = await Promise.all(newsEnabled.map(function(p) {
      return fetch(NEWS_API + '?ticker=' + p.sym + '&days=1')
        .then(function(r){ return r.json(); })
        .then(function(data){ return [p.sym, Array.isArray(data) && data.length > 0]; })
        .catch(function(){ return [p.sym, false]; });
    }));
    // Reset all then apply
    tickers.forEach(function(t){ tickerNews[t] = false; });
    results.forEach(function(pair){ tickerNews[pair[0]] = pair[1]; });
    buildTape();
  } catch(e) {
    console.warn('News fetch error:', e.message);
  }
}

async function fetchMacroNews() {
  if (alertDismissed) return;
  try {
    const r = await fetch(NEWS_API + '?ticker=SPY&days=1');
    const data = await r.json();
    if (!Array.isArray(data) || !data.length) return;
    // Find first headline matching macro keywords
    var macroItem = null;
    for (var i = 0; i < data.length; i++) {
      var hl = (data[i].headline || '').toLowerCase();
      for (var j = 0; j < MACRO_KEYWORDS.length; j++) {
        if (hl.indexOf(MACRO_KEYWORDS[j]) >= 0) {
          macroItem = data[i];
          break;
        }
      }
      if (macroItem) break;
    }
    if (macroItem) showAlert(macroItem.headline, macroItem.url);
  } catch(e) {
    console.warn('Macro news fetch error:', e.message);
  }
}

function showAlert(headline, url) {
  var banner = document.getElementById('alert-banner');
  var text   = document.getElementById('alert-text');
  if (!banner || !text) return;
  text.textContent = headline;
  text.onclick = url ? function() {
    if (window.pulseAPI) window.pulseAPI.openExternal(url);
    else window.open(url, '_blank');
  } : null;
  if (url) text.style.cursor = 'pointer';
  banner.classList.add('visible');
  // Auto-dismiss after 15 seconds
  setTimeout(function() { dismissAlert(); }, 15000);
}

function dismissAlert() {
  var banner = document.getElementById('alert-banner');
  if (banner) banner.classList.remove('visible');
  alertDismissed = true;
  // Allow new alerts after 10 minutes
  setTimeout(function() { alertDismissed = false; }, 600000);
}

async function init() {
  if (window.pulseAPI) {
    const saved = await window.pulseAPI.getSettings();
    if (saved?.tickers?.length) tickers = saved.tickers;
  }
  ads = selectAds(tickers);
  buildAdZone();
  await fetchQuotes();
  buildTape(true);
  rafId = requestAnimationFrame(animateTape);
  setInterval(fetchQuotes, 15000);
  setInterval(rotateAd, 20000);
  // Fetch news on launch then every 5 minutes
  fetchTickerNews();
  fetchMacroNews();
  setInterval(fetchTickerNews, 300000);
  setInterval(fetchMacroNews, 300000);

  // Responsive ad zone — wider on larger screens
  function setResponsiveLayout() {
    var w = window.screen.width;
    var adZone = document.querySelector('.ad-zone');
    if (!adZone) return;
    if (w >= 2560)      adZone.style.width = '420px';
    else if (w >= 1920) adZone.style.width = '340px';
    else if (w >= 1680) adZone.style.width = '310px';
    else                adZone.style.width = '280px';
  }
  setResponsiveLayout();
}

init();

document.addEventListener('mouseleave', () => window.pulseAPI?.setIgnoreMouse(true));
document.addEventListener('mouseenter', () => window.pulseAPI?.setIgnoreMouse(false));
window.pulseAPI?.setIgnoreMouse(false);
</script>
