<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 44px; overflow: hidden; user-select: none; -webkit-user-select: none; }
body {
  font-family: 'Inter', -apple-system, sans-serif;
  background: #ffffff;
  color: #0F172A;
  display: flex;
  align-items: center;
  height: 44px;
  border-bottom: 2px solid #1A6BF5;
  -webkit-app-region: no-drag;
}

/* ── BRAND ── */
.brand {
  display: flex; align-items: center; gap: 8px;
  padding: 0 16px; border-right: 1px solid #E2E8F0;
  height: 100%; flex-shrink: 0; cursor: pointer; transition: background .15s;
}
.brand:hover { background: #F8FAFC; }
.brand-icon {
  width: 26px; height: 26px; background: #1A6BF5; border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; color: #fff; flex-shrink: 0;
}
.brand-name { font-size: 14px; font-weight: 700; color: #0F172A; letter-spacing: -.4px; white-space: nowrap; }
.brand-name span { color: #1A6BF5; }

/* ── SEARCH ── */
.search-zone {
  display: flex; align-items: center; gap: 6px;
  padding: 0 12px; border-right: 1px solid #E2E8F0;
  height: 100%; flex-shrink: 0;
}
#search-input {
  background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 7px;
  color: #0F172A; font-size: 12px; font-family: 'Inter', sans-serif;
  padding: 5px 11px; width: 130px; outline: none; transition: border-color .15s, box-shadow .15s;
}
#search-input:focus { border-color: #1A6BF5; box-shadow: 0 0 0 3px rgba(26,107,245,.12); background: #fff; }
#search-input::placeholder { color: #94A3B8; }
.search-btn {
  background: #1A6BF5; border: none; border-radius: 7px; color: #fff;
  font-size: 12px; font-weight: 600; font-family: 'Inter', sans-serif;
  padding: 5px 12px; cursor: pointer; white-space: nowrap; transition: background .15s;
}
.search-btn:hover { background: #1558D6; }

/* ── TICKER TAPE ── */
.ticker-viewport {
  flex: 1; overflow: hidden; position: relative; height: 100%;
  mask-image: linear-gradient(to right, transparent 0%, black 1.5%, black 98.5%, transparent 100%);
  -webkit-mask-image: linear-gradient(to right, transparent 0%, black 1.5%, black 98.5%, transparent 100%);
}
.ticker-tape {
  display: flex; position: absolute; left: 0; top: 0;
  height: 100%; align-items: center; white-space: nowrap; will-change: transform;
}
.tick-item {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 0 16px; height: 100%; cursor: pointer;
  border-right: 1px solid #F1F5F9; transition: background .1s; flex-shrink: 0;
}
.tick-item:hover { background: #EFF6FF; }
.tick-item:hover .tick-sym { color: #1A6BF5; }
.tick-sym { font-size: 12px; font-weight: 700; color: #0F172A; letter-spacing: .01em; transition: color .1s; }
.tick-price { font-size: 12px; color: #475569; font-family: 'JetBrains Mono', monospace; }
.tick-chg { font-size: 11px; font-weight: 600; font-family: 'JetBrains Mono', monospace; }
.tick-chg.up  { color: #16A34A; }
.tick-chg.dn  { color: #DC2626; }
.tick-chg.flat { color: #94A3B8; }

/* ── AD ZONE ── */
.ad-zone {
  width: 280px; height: 100%; flex-shrink: 0;
  border-left: 1px solid #E2E8F0; position: relative; overflow: hidden;
  background: #FAFBFF; cursor: pointer;
}
.ad-slide {
  position: absolute; inset: 0; display: flex; align-items: center;
  gap: 8px; padding: 0 12px;
  opacity: 0; transition: opacity .6s ease;
}
.ad-slide.active { opacity: 1; }
.ad-slide:hover { background: #EFF6FF; }

/* Ad logo badge */
.ad-cta-pill{font-size:9px;font-weight:700;color:#fff;padding:3px 8px;border-radius:4px;white-space:nowrap;flex-shrink:0;letter-spacing:.02em;}
.ad-logo-badge {
  width: 28px; height: 28px; border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 800; color: #fff; flex-shrink: 0;
  letter-spacing: -.5px;
}
.ad-body { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
.ad-headline { font-size: 11px; font-weight: 600; color: #0F172A; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ad-sub { font-size: 10px; color: #94A3B8; white-space: nowrap; }
.ad-cta {
  font-size: 10px; font-weight: 700; padding: 3px 9px;
  border-radius: 6px; white-space: nowrap; flex-shrink: 0;
  background: #1A6BF5; color: #fff; border: none; cursor: pointer;
  transition: background .15s;
}
.ad-cta:hover { background: #1558D6; }

/* ── EXIT BUTTON ── */
.edit-btn {
  display: flex; align-items: center; padding: 0 10px;
  height: 100%; flex-shrink: 0; border-right: 1px solid #E2E8F0;
  cursor: pointer; font-size: 11px; font-weight: 600; color: #1A6BF5;
  background: #fff; transition: background .15s; white-space: nowrap;
  gap: 4px;
}
.edit-btn:hover { background: #EFF6FF; }
.exit-btn {
  width: 42px; height: 100%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  border-left: 1px solid #E2E8F0; cursor: pointer;
  color: #94A3B8; font-size: 16px; transition: all .15s; background: #fff;
}
.exit-btn:hover { background: #FEF2F2; color: #DC2626; }
.news-dot { width: 6px; height: 6px; border-radius: 50%; background: #DC2626; flex-shrink: 0; animation: newspulse 1.5s infinite; margin-right: 2px; }
@keyframes newspulse { 0%,100%{opacity:1;transform:scale(1);} 50%{opacity:.5;transform:scale(0.8);} }
.alert-banner {
  position: fixed; top: 44px; left: 0; right: 0; z-index: 9998;
  background: #0F172A; color: #F8FAFC; font-size: 11px; font-weight: 600;
  font-family: 'Inter', sans-serif; padding: 0 16px;
  display: flex; align-items: center; gap: 10px;
  height: 0; overflow: hidden; transition: height .3s ease;
  border-bottom: 2px solid #DC2626;
}
.alert-banner.visible { height: 28px; }
.alert-tag { background: #DC2626; color: #fff; font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 4px; letter-spacing: .06em; flex-shrink: 0; }
.alert-text { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.alert-close { cursor: pointer; color: #64748B; font-size: 14px; flex-shrink: 0; }
.alert-close:hover { color: #E2E8F0; }

/* ── SETTINGS OVERLAY ── */
.settings-overlay {
  position: fixed; inset: 0; background: rgba(15,23,42,.4);
  display: none; align-items: center; justify-content: center; z-index: 9999;
}
.settings-overlay.open { display: flex; }
.settings-panel {
  background: #ffffff; border: 1px solid #E2E8F0;
  border-radius: 14px; padding: 24px; width: 380px;
  max-height: 80vh; overflow-y: auto;
  box-shadow: 0 20px 60px rgba(15,23,42,.15);
}
.settings-panel h2 { font-size: 16px; font-weight: 700; color: #0F172A; margin-bottom: 4px; }
.settings-subtitle { font-size: 13px; color: #64748B; margin-bottom: 20px; }
.settings-label { font-size: 11px; font-weight: 600; color: #64748B; text-transform: uppercase; letter-spacing: .07em; margin-bottom: 8px; }
#tickers-input {
  width: 100%; background: #F8FAFC; border: 1px solid #E2E8F0;
  border-radius: 8px; color: #0F172A; font-family: 'JetBrains Mono', monospace;
  font-size: 12px; padding: 10px 12px; height: 90px; resize: none; outline: none; transition: border-color .15s;
}
#tickers-input:focus { border-color: #1A6BF5; box-shadow: 0 0 0 3px rgba(26,107,245,.1); }
.settings-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }
.btn { padding: 8px 18px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; font-family: 'Inter', sans-serif; transition: all .15s; }
.btn-primary { background: #1A6BF5; color: #fff; }
.btn-primary:hover { background: #1558D6; }
.settings-hint { font-size: 11px; color: #94A3B8; margin-top: 6px; margin-bottom: 2px; }
.pref-row { display:flex; align-items:center; gap:8px; background:#F8FAFC; border:1px solid #E2E8F0; border-radius:8px; padding:8px 10px; }
.pref-sym { font-size:13px; font-weight:700; color:#0F172A; flex:1; }
.pref-check { display:flex; align-items:center; gap:5px; font-size:11px; color:#475569; cursor:pointer; }
.pref-check input { accent-color:#1A6BF5; width:13px; height:13px; cursor:pointer; }
.pref-remove { color:#94A3B8; cursor:pointer; font-size:16px; transition:color .15s; padding:0 2px; }
.pref-remove:hover { color:#DC2626; }
.btn-secondary { background: #F8FAFC; color: #475569; border: 1px solid #E2E8F0; }
.btn-secondary:hover { background: #F1F5F9; }
</style>
</head>
<body>

<!-- MACRO NEWS ALERT BANNER -->
<div class="alert-banner" id="alert-banner">
  <span class="alert-tag">⚡ MARKET ALERT</span>
  <span class="alert-text" id="alert-text"></span>
  <span class="alert-close" onclick="dismissAlert()">✕</span>
</div>

<!-- BRAND -->
<div class="brand" id="brand-btn" title="Open PulseStock">
  <div class="brand-icon">P</div>
  <div class="brand-name">Pulse<span>Stock</span></div>
</div>

<!-- SEARCH -->
<div class="search-zone">
  <input id="search-input" type="text" placeholder="Search ticker..." maxlength="10"
    onkeydown="if(event.key==='Enter') doSearch()" />
  <button class="search-btn" onclick="doSearch()">Analyze ↗</button>
</div>

<!-- EDIT TICKERS BUTTON -->
<div class="edit-btn" id="edit-btn" onclick="openSettingsWindow()" title="Edit your tickers">
  ✎ Edit
</div>

<!-- TICKER TAPE — takes all remaining space -->
<div class="ticker-viewport">
  <div class="ticker-tape" id="ticker-tape"></div>
</div>

<!-- AD ZONE -->
<div class="ad-zone" id="ad-zone"></div>

<!-- EXIT BUTTON -->
<div class="exit-btn" id="exit-btn" title="Quit PulseStock Ticker"
  onclick="if(window.pulseAPI)window.pulseAPI.quit();else window.close();">✕</div>

<!-- SETTINGS OVERLAY -->
<div class="settings-overlay" id="settings-overlay">
  <div class="settings-panel">
    <h2>Edit Ticker Bar</h2>
    <div class="settings-subtitle">Manage your stocks and choose what to track for each.</div>

    <div class="settings-label">Your Tickers</div>
    <div id="prefs-list" style="display:flex;flex-direction:column;gap:6px;margin-bottom:14px;max-height:220px;overflow-y:auto;"></div>

    <div style="display:flex;gap:6px;margin-bottom:16px;">
      <input id="add-ticker-input" type="text" placeholder="Add ticker e.g. NVDA"
        style="flex:1;padding:7px 10px;border:1px solid #E2E8F0;border-radius:7px;font-size:13px;font-family:'Inter',sans-serif;outline:none;background:#F8FAFC;"
        onkeydown="if(event.key==='Enter') addTicker()"
        onfocus="this.style.borderColor='#1A6BF5'" onblur="this.style.borderColor='#E2E8F0'" />
      <button onclick="addTicker()" style="padding:7px 14px;background:#1A6BF5;color:#fff;border:none;border-radius:7px;font-size:13px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;">+ Add</button>
    </div>

    <div class="settings-label">Scroll Speed</div>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px;">
      <span style="font-size:11px;color:#94A3B8;">Slow</span>
      <input type="range" id="speed-slider" min="0.3" max="3" step="0.1" style="flex:1;accent-color:#1A6BF5;" />
      <span style="font-size:11px;color:#94A3B8;">Fast</span>
    </div>
    <div style="font-size:11px;color:#94A3B8;margin-bottom:14px;">Current: <span id="speed-label">1x</span></div>

    <div class="settings-actions">
      <button class="btn btn-secondary" onclick="closeSettings()">Cancel</button>
      <button class="btn btn-primary" onclick="saveSettings()">Save & Update</button>
    </div>
  </div>
</div>

<script>
// tickerPrefs: array of {sym, news} objects
let tickerPrefs = [
  {sym:'AAPL',news:true},{sym:'NVDA',news:true},{sym:'MSFT',news:true},
  {sym:'TSLA',news:true},{sym:'META',news:true},{sym:'AMZN',news:true},
  {sym:'JPM',news:true},{sym:'GOOGL',news:true},{sym:'BRK-B',news:true},{sym:'XOM',news:true}
];
let tickers = tickerPrefs.map(function(p){ return p.sym; });
let quotes    = {};
let tapePx    = 0;
let tapeSpeed = 0.6;
let rafId     = null;
let adIndex   = 0;

const FINNHUB_KEY = 'd95c889r01qihq3l33k0d95c889r01qihq3l33kg';
const NEWS_API = 'https://pulsestock-nu.vercel.app/api/news';
const MACRO_KEYWORDS = ['fed','federal reserve','rate','inflation','gdp','jobs','unemployment','cpi','fomc','recession','tariff','sanctions','war','crash','rally','surge','plunge','bankruptcy','default'];
let tickerNews = {}; // { AAPL: true/false }
let alertDismissed = false;

// ── ADS with logo badges ───────────────────────────────────────────────────────
const ads = [
  { abbr:'RH',   name:'Robinhood',           color:'#00C805', bg:'#F0FDF4', hl:'Invest with no commissions',        sub:'Stocks, ETFs, options & crypto',      cta:'Start free',    url:'https://robinhood.com' },
  { abbr:'IBKR', name:'Interactive Brokers',  color:'#C8102E', bg:'#FEF2F2', hl:'Professional-grade trading',        sub:'Lowest margin rates globally',        cta:'Open account',  url:'https://www.interactivebrokers.com' },
  { abbr:'tt',   name:'tastytrade',           color:'#FF6B35', bg:'#FFF7ED', hl:'Trade options for $1',              sub:'$0 to close · Award-winning platform', cta:'Trade now',     url:'https://tastytrade.com' },
  { abbr:'WB',   name:'Webull',               color:'#1890FF', bg:'#EFF6FF', hl:'Advanced charts & screeners',       sub:'Free for active traders',             cta:'Get started',   url:'https://www.webull.com' },
  { abbr:'SCH',  name:'Charles Schwab',       color:'#00A7B5', bg:'#F0FDFA', hl:'$0 trades. No account minimum.',    sub:'Trusted by millions of investors',    cta:'Open free',     url:'https://www.schwab.com' },
];

function buildAdZone() {
  const zone = document.getElementById('ad-zone');
  zone.innerHTML = '';
  ads.forEach((ad, i) => {
    const div = document.createElement('div');
    div.className = 'ad-slide' + (i === 0 ? ' active' : '');
    div.style.background = ad.bg || '#FAFBFF';
    const fontSize = ad.abbr.length > 2 ? '9px' : '11px';
    div.innerHTML =
      '<div class="ad-logo-badge" style="background:' + ad.color + ';font-size:' + fontSize + '">' + ad.abbr + '</div>' +
      '<div class="ad-body">' +
        '<span class="ad-headline">' + ad.hl + '</span>' +
        '<span class="ad-sub">' + ad.sub + '</span>' +
      '</div>' +
      '<span class="ad-cta-pill" style="background:' + ad.color + '">' + ad.cta + ' →</span>';
    div.addEventListener('click', () => {
      if (window.pulseAPI) window.pulseAPI.openExternal(ad.url);
      else window.open(ad.url, '_blank');
    });
    zone.appendChild(div);
  });
}

function rotateAd() {
  const slides = document.querySelectorAll('.ad-slide');
  if (!slides.length) return;
  slides[adIndex].classList.remove('active');
  adIndex = (adIndex + 1) % ads.length;
  slides[adIndex].classList.add('active');
}

// ── TICKER TAPE ────────────────────────────────────────────────────────────────
function buildTape() {
  const tape = document.getElementById('ticker-tape');
  const items = [...tickers, ...tickers, ...tickers].map(t => buildTickItem(t)).join('');
  tape.innerHTML = items;
  tapePx = 0;
  tape.style.transform = 'translateX(0px)';
}

function buildTickItem(ticker) {
  const q = quotes[ticker];
  let price = '—', chgStr = '—', cls = 'flat';
  if (q) {
    price = '$' + q.price.toFixed(2);
    const pct = q.changePct;
    if (pct > 0)      { chgStr = '▲ +' + pct.toFixed(2) + '%'; cls = 'up'; }
    else if (pct < 0) { chgStr = '▼ '  + pct.toFixed(2) + '%'; cls = 'dn'; }
    else              { chgStr = '0.00%'; }
  }
  var newsDot = tickerNews[ticker] ? '<span class="news-dot" title="News available"></span>' : '';
  return '<div class="tick-item" onclick="openStock(\'' + ticker + '\')" title="Analyze ' + ticker + ' on PulseStock">'
    + newsDot
    + '<span class="tick-sym">' + ticker + '</span>'
    + '<span class="tick-price">' + price + '</span>'
    + '<span class="tick-chg ' + cls + '">' + chgStr + '</span>'
    + '</div>';
}

function animateTape() {
  const tape = document.getElementById('ticker-tape');
  if (!tape) return;
  tapePx -= tapeSpeed;
  const items = tape.children;
  if (items.length > 0) {
    const oneSetWidth = items[0].offsetWidth * tickers.length;
    if (Math.abs(tapePx) >= oneSetWidth) tapePx += oneSetWidth;
  }
  tape.style.transform = `translateX(${tapePx}px)`;
  rafId = requestAnimationFrame(animateTape);
}

// ── QUOTES ─────────────────────────────────────────────────────────────────────
async function fetchQuotes() {
  try {
    var fetched = {};
    // Try main process fetch first (bypasses renderer CSP)
    if (window.pulseAPI && window.pulseAPI.getQuotes) {
      try {
        fetched = await window.pulseAPI.getQuotes(tickers);
      } catch(e) {}
    }
    // If main process fetch got nothing, try renderer fetch
    if (!fetched || Object.keys(fetched).length === 0) {
      var results = await Promise.all(tickers.map(function(t) {
        return fetch('https://finnhub.io/api/v1/quote?symbol=' + encodeURIComponent(t) + '&token=' + FINNHUB_KEY)
          .then(function(r) { return r.json(); })
          .then(function(d) {
            return [t, (d && d.c && d.c > 0) ? { price: d.c, changePct: d.dp, change: d.d } : null];
          })
          .catch(function() { return [t, null]; });
      }));
      results.forEach(function(pair) { if (pair[1]) fetched[pair[0]] = pair[1]; });
    }
    quotes = fetched;
    buildTape();
  } catch(e) {
    console.error('Quote fetch error:', e);
  }
}

// ── NAVIGATION ─────────────────────────────────────────────────────────────────
function openStock(ticker) {
  const t = ticker.trim().toUpperCase();
  const url = 'https://pulsestock-nu.vercel.app/?ticker=' + t;
  if (window.pulseAPI) window.pulseAPI.openExternal(url);
  else window.open(url, '_blank');
}

function doSearch() {
  const input = document.getElementById('search-input');
  const ticker = input.value.trim().toUpperCase().replace(/[^A-Z0-9.-]/g, '');
  if (!ticker) return;
  const url = 'https://pulsestock-nu.vercel.app/?ticker=' + ticker;
  if (window.pulseAPI) window.pulseAPI.openExternal(url);
  else window.open(url, '_blank');
  input.value = '';
}

document.getElementById('brand-btn').addEventListener('click', () => {
  const url = 'https://pulsestock-nu.vercel.app';
  if (window.pulseAPI) window.pulseAPI.openExternal(url);
  else window.open(url, '_blank');
});

// ── SETTINGS ───────────────────────────────────────────────────────────────────
function renderPrefsList() {
  var list = document.getElementById('prefs-list');
  if (!list) return;
  list.innerHTML = '';
  tickerPrefs.forEach(function(pref, idx) {
    var row = document.createElement('div');
    row.className = 'pref-row';
    row.innerHTML =
      '<span class="pref-sym">' + pref.sym + '</span>' +
      '<label class="pref-check">' +
        '<input type="checkbox" ' + (pref.news ? 'checked' : '') + ' onchange="toggleNews(' + idx + ', this.checked)" />' +
        '🔴 News alerts' +
      '</label>' +
      '<span class="pref-remove" onclick="removeTicker(' + idx + ')" title="Remove">✕</span>';
    list.appendChild(row);
  });
}

function toggleNews(idx, val) {
  if (tickerPrefs[idx]) tickerPrefs[idx].news = val;
}

function addTicker() {
  var input = document.getElementById('add-ticker-input');
  var sym = input.value.trim().toUpperCase().replace(/[^A-Z0-9.\-]/g, '');
  if (!sym) return;
  if (tickerPrefs.find(function(p){ return p.sym === sym; })) {
    input.value = '';
    return;
  }
  // Add with prefs prompt
  tickerPrefs.push({ sym: sym, news: true }); // default news ON for new symbols
  input.value = '';
  renderPrefsList();
}

function removeTicker(idx) {
  tickerPrefs.splice(idx, 1);
  renderPrefsList();
}

function openSettingsWindow() {
  if (window.pulseAPI) window.pulseAPI.openSettingsWindow();
}

function openSettings() {
  renderPrefsList();
  var slider = document.getElementById('speed-slider');
  if (slider) {
    slider.value = tapeSpeed;
    document.getElementById('speed-label').textContent = tapeSpeed.toFixed(1) + 'x';
    slider.oninput = function() {
      document.getElementById('speed-label').textContent = parseFloat(this.value).toFixed(1) + 'x';
    };
  }
  document.getElementById('settings-overlay').classList.add('open');
}
function closeSettings() {
  document.getElementById('settings-overlay').classList.remove('open');
}
async function saveSettings() {
  if (!tickerPrefs.length) return alert('Add at least one ticker.');
  tickers = tickerPrefs.map(function(p){ return p.sym; });
  var slider = document.getElementById('speed-slider');
  if (slider) tapeSpeed = parseFloat(slider.value);
  if (window.pulseAPI) await window.pulseAPI.saveSettings({ tickers: tickers, speed: tapeSpeed });
  closeSettings();
  // Re-fetch news for any new symbols with news enabled
  await fetchTickerNews();
  await fetchQuotes();
  buildTape();
}

document.addEventListener('contextmenu', e => {
  if (e.target.closest('.tick-item') || e.target.closest('.brand')) {
    e.preventDefault(); openSettings();
  }
});
document.getElementById('brand-btn').addEventListener('contextmenu', e => {
  e.preventDefault(); openSettings();
});
window.pulseAPI?.onOpenSettings(() => openSettings());

// Listen for prefs updates from settings window
window.pulseAPI?.onUpdateTickerPrefs(function(saved) {
  if (!saved) return;
  tickerPrefs = saved.prefs || tickerPrefs;
  tickers = tickerPrefs.map(function(p){ return p.sym; });
  if (saved.speed) tapeSpeed = saved.speed;
  fetchTickerNews();
  fetchQuotes();
});

// Live ticker update from main process (after login/sync)
window.pulseAPI?.onUpdateTickers(async (newTickers) => {
  if (newTickers?.length) {
    tickers = newTickers;
    await fetchQuotes();
    buildTape();
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeSettings();
  if ((e.metaKey || e.ctrlKey) && e.key === ',') openSettings();
});

// ── INIT ───────────────────────────────────────────────────────────────────────
// ── NEWS FUNCTIONS ─────────────────────────────────────────────────────────────
async function fetchTickerNews() {
  try {
    // Only fetch for tickers that have news alerts enabled
    var newsEnabled = tickerPrefs.filter(function(p){ return p.news; });
    if (!newsEnabled.length) { buildTape(); return; }
    var results = await Promise.all(newsEnabled.map(function(p) {
      return fetch(NEWS_API + '?ticker=' + p.sym + '&days=1')
        .then(function(r){ return r.json(); })
        .then(function(data){ return [p.sym, Array.isArray(data) && data.length > 0]; })
        .catch(function(){ return [p.sym, false]; });
    }));
    // Reset all then apply
    tickers.forEach(function(t){ tickerNews[t] = false; });
    results.forEach(function(pair){ tickerNews[pair[0]] = pair[1]; });
    buildTape();
  } catch(e) {
    console.warn('News fetch error:', e.message);
  }
}

async function fetchMacroNews() {
  if (alertDismissed) return;
  try {
    const r = await fetch(NEWS_API + '?ticker=SPY&days=1');
    const data = await r.json();
    if (!Array.isArray(data) || !data.length) return;
    // Find first headline matching macro keywords
    var macroItem = null;
    for (var i = 0; i < data.length; i++) {
      var hl = (data[i].headline || '').toLowerCase();
      for (var j = 0; j < MACRO_KEYWORDS.length; j++) {
        if (hl.indexOf(MACRO_KEYWORDS[j]) >= 0) {
          macroItem = data[i];
          break;
        }
      }
      if (macroItem) break;
    }
    if (macroItem) showAlert(macroItem.headline, macroItem.url);
  } catch(e) {
    console.warn('Macro news fetch error:', e.message);
  }
}

function showAlert(headline, url) {
  var banner = document.getElementById('alert-banner');
  var text   = document.getElementById('alert-text');
  if (!banner || !text) return;
  text.textContent = headline;
  text.onclick = url ? function() {
    if (window.pulseAPI) window.pulseAPI.openExternal(url);
    else window.open(url, '_blank');
  } : null;
  if (url) text.style.cursor = 'pointer';
  banner.classList.add('visible');
  // Auto-dismiss after 15 seconds
  setTimeout(function() { dismissAlert(); }, 15000);
}

function dismissAlert() {
  var banner = document.getElementById('alert-banner');
  if (banner) banner.classList.remove('visible');
  alertDismissed = true;
  // Allow new alerts after 10 minutes
  setTimeout(function() { alertDismissed = false; }, 600000);
}

async function init() {
  if (window.pulseAPI) {
    const saved = await window.pulseAPI.getSettings();
    if (saved?.tickers?.length) tickers = saved.tickers;
  }
  buildAdZone();
  await fetchQuotes();
  buildTape();
  rafId = requestAnimationFrame(animateTape);
  setInterval(fetchQuotes, 15000);
  setInterval(rotateAd, 20000);
  // Fetch news on launch then every 5 minutes
  fetchTickerNews();
  fetchMacroNews();
  setInterval(fetchTickerNews, 300000);
  setInterval(fetchMacroNews, 300000);
}

init();

document.addEventListener('mouseleave', () => window.pulseAPI?.setIgnoreMouse(true));
document.addEventListener('mouseenter', () => window.pulseAPI?.setIgnoreMouse(false));
window.pulseAPI?.setIgnoreMouse(false);
</script>
