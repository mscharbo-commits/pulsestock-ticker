<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'self' https://ttcprqkoibiztibhpsrp.supabase.co; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://ttcprqkoibiztibhpsrp.supabase.co;">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: 'Inter', -apple-system, sans-serif; background: #ffffff; color: #0F172A; }
body { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 28px 24px; }
.logo { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; }
.logo-icon { width: 38px; height: 38px; background: #1A6BF5; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; color: #fff; }
.logo-name { font-size: 20px; font-weight: 700; color: #0F172A; letter-spacing: -.5px; }
.logo-name span { color: #1A6BF5; }
h2 { font-size: 15px; font-weight: 600; color: #0F172A; margin-bottom: 4px; text-align: center; }
.subtitle { font-size: 12px; color: #64748B; margin-bottom: 20px; text-align: center; line-height: 1.5; }
.demo-badge {
  width: 100%; background: #EFF6FF; border: 1px solid #BFDBFE;
  border-radius: 8px; padding: 10px 14px; margin-bottom: 16px;
  display: flex; align-items: center; gap: 8px;
}
.demo-badge-icon { font-size: 16px; }
.demo-badge-text { font-size: 12px; color: #1558D6; line-height: 1.4; }
.demo-badge-text strong { font-weight: 600; }
.field { margin-bottom: 12px; width: 100%; }
label { font-size: 11px; font-weight: 600; color: #475569; display: block; margin-bottom: 4px; }
input[type=email], input[type=password] {
  width: 100%; padding: 9px 12px; border: 1px solid #E2E8F0; border-radius: 8px;
  font-size: 13px; font-family: 'Inter', sans-serif; color: #0F172A;
  background: #F8FAFC; outline: none; transition: border-color .15s, box-shadow .15s;
}
input:focus { border-color: #1A6BF5; box-shadow: 0 0 0 3px rgba(26,107,245,.12); background: #fff; }
.remember { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; cursor: pointer; }
.remember input { width: 14px; height: 14px; cursor: pointer; accent-color: #1A6BF5; }
.remember span { font-size: 12px; color: #475569; }
.btn-signin {
  width: 100%; padding: 10px; background: #1A6BF5; color: #fff; border: none;
  border-radius: 8px; font-size: 14px; font-weight: 600; font-family: 'Inter', sans-serif;
  cursor: pointer; transition: background .15s; margin-bottom: 8px;
}
.btn-signin:hover { background: #1558D6; }
.btn-signin:disabled { background: #93B4F8; cursor: not-allowed; }
.btn-demo {
  width: 100%; padding: 9px; background: #F8FAFC; color: #1A6BF5; border: 1.5px solid #BFDBFE;
  border-radius: 8px; font-size: 13px; font-weight: 600; font-family: 'Inter', sans-serif;
  cursor: pointer; transition: all .15s; margin-bottom: 10px;
}
.btn-demo:hover { background: #EFF6FF; }
.error { font-size: 12px; color: #DC2626; background: #FEF2F2; border: 1px solid #FECACA; border-radius: 7px; padding: 8px 12px; margin-bottom: 12px; display: none; }
.skip { font-size: 11px; color: #94A3B8; cursor: pointer; text-align: center; }
.skip:hover { color: #64748B; }
.divider { display: flex; align-items: center; gap: 8px; margin: 12px 0; width: 100%; }
.divider-line { flex: 1; height: 1px; background: #F1F5F9; }
.divider-text { font-size: 11px; color: #94A3B8; }
</style>
</head>
<body>
<div class="logo">
  <div class="logo-icon">P</div>
  <div class="logo-name">Pulse<span>Stock</span></div>
</div>
<h2>Sign in to sync your tickers</h2>
<p class="subtitle">Use your PulseStock account to load<br>your personalized ticker list.</p>

<div class="demo-badge">
  <div class="demo-badge-icon">🎯</div>
  <div class="demo-badge-text"><strong>Demo pre-loaded</strong> — click Sign In to try it instantly, or enter your own credentials below.</div>
</div>

<div class="error" id="error-msg"></div>

<div class="field">
  <label>Email</label>
  <input type="email" id="email" value="demo@pulsestock.io" autocomplete="email" />
</div>
<div class="field">
  <label>Password</label>
  <input type="password" id="password" value="PulseDemo2024!" autocomplete="current-password"
    onkeydown="if(event.key==='Enter') signIn()" />
</div>

<label class="remember">
  <input type="checkbox" id="remember" checked />
  <span>Remember me on this device</span>
</label>

<button class="btn-signin" id="signin-btn" onclick="signIn()">Sign In</button>

<div class="divider">
  <div class="divider-line"></div>
  <div class="divider-text">or</div>
  <div class="divider-line"></div>
</div>

<button class="btn-demo" onclick="loadDemo()">▶ Try Demo — no account needed</button>
<div class="skip" onclick="skip()">Skip for now</div>

<script>
const SUPABASE_URL = 'https://ttcprqkoibiztibhpsrp.supabase.co';
const SUPABASE_KEY = 'sb_publishable_iQhPAY-M-OUbFVbLQyCp5g_540rSkd1';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// Demo tickers shown when using demo account or demo button
const DEMO_TICKERS = ['AAPL','NVDA','MSFT','TSLA','META','AMZN','JPM','GOOGL','BRK-B','XOM'];

async function signIn() {
  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const remember = document.getElementById('remember').checked;
  const btn      = document.getElementById('signin-btn');
  const err      = document.getElementById('error-msg');

  if (!email || !password) { showError('Please enter your email and password.'); return; }

  btn.disabled = true;
  btn.textContent = 'Signing in…';
  err.style.display = 'none';

  // Demo account — bypass Supabase
  if (email === 'demo@pulsestock.io') {
    setTimeout(() => {
      window.loginAPI.loginSuccess({
        userId:   'demo',
        email:    'demo@pulsestock.io',
        username: 'Demo User',
        tickers:  DEMO_TICKERS,
        remember: false,
        token:    null,
        refresh:  null,
      });
    }, 600);
    return;
  }

  try {
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) throw error;

    const { data: profile } = await sb.from('profiles')
      .select('tickers, username')
      .eq('id', data.user.id)
      .single();

    const tickers = profile?.tickers
      ? profile.tickers.split(',').map(s => s.trim()).filter(Boolean)
      : DEMO_TICKERS;

    window.loginAPI.loginSuccess({
      userId:   data.user.id,
      email:    data.user.email,
      username: profile?.username || email.split('@')[0],
      tickers:  tickers,
      remember: remember,
      token:    data.session.access_token,
      refresh:  data.session.refresh_token,
    });
  } catch(e) {
    showError(e.message || 'Sign in failed. Check your credentials and try again.');
    btn.disabled = false;
    btn.textContent = 'Sign In';
  }
}

function loadDemo() {
  window.loginAPI.loginSuccess({
    userId:   'demo',
    email:    'demo@pulsestock.io',
    username: 'Demo User',
    tickers:  DEMO_TICKERS,
    remember: false,
    token:    null,
    refresh:  null,
  });
}

function skip() { window.loginAPI.loginSkip(); }

function showError(msg) {
  const err = document.getElementById('error-msg');
  err.textContent = msg;
  err.style.display = 'block';
}
</script>
</body>
</html>
