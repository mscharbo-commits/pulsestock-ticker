<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width:400px; height:320px;
  background:#0D1117; color:#F0F4FF;
  font-family:'Inter',-apple-system,sans-serif;
  overflow:hidden;
  border:1px solid #1E2D45;
  border-top:none;
  border-radius:0 0 12px 12px;
}
#header {
  display:flex; align-items:center; justify-content:space-between;
  padding:10px 14px; border-bottom:1px solid #1E2D45;
  background:linear-gradient(135deg,rgba(26,107,245,.1),rgba(99,102,241,.06));
}
#header-left { display:flex; align-items:center; gap:8px; }
.badge { font-size:9px; font-weight:700; padding:1px 5px; border-radius:8px; background:rgba(16,185,129,.15); color:#10B981; }
#close-btn { background:none; border:none; color:#475569; font-size:18px; cursor:pointer; padding:0 4px; }
#close-btn:hover { color:#F0F4FF; }
#body {
  padding:12px 14px;
  font-size:12px; color:#94A3B8; line-height:1.7;
  overflow-y:auto;
  height:220px;
}
#body.loaded { color:#F0F4FF; }
#input-row {
  display:flex; gap:6px; padding:8px 12px;
  border-top:1px solid #1E2D45;
  position:absolute; bottom:0; left:0; right:0;
}
#followup {
  flex:1; background:#1A2236; border:1px solid #1E2D45;
  border-radius:7px; color:#F0F4FF; font-size:11px;
  padding:5px 10px; outline:none; font-family:inherit;
}
#followup:focus { border-color:#1A6BF5; }
#followup::placeholder { color:#475569; }
#send-btn {
  background:linear-gradient(135deg,#1A6BF5,#6366F1);
  color:#fff; border:none; border-radius:7px;
  padding:0 12px; font-size:14px; cursor:pointer;
  height:32px;
}
.typing { display:flex; gap:4px; align-items:center; padding:4px 0; }
.typing span {
  width:6px; height:6px; background:#1A6BF5;
  border-radius:50%; animation:t .8s infinite;
  display:inline-block;
}
.typing span:nth-child(2) { animation-delay:.15s; }
.typing span:nth-child(3) { animation-delay:.3s; }
@keyframes t { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-5px)} }
</style>
</head>
<body>
<div id="header">
  <div id="header-left">
    <span style="font-size:16px;">⚡</span>
    <span style="font-size:13px;font-weight:700;">PulseStock AI</span>
    <span class="badge">LIVE</span>
  </div>
  <button id="close-btn" onclick="closeCard()">✕</button>
</div>
<div id="body">
  <div class="typing">
    <span></span><span></span><span></span>
  </div>
</div>
<div id="input-row">
  <input id="followup" placeholder="Follow up question..."
    onkeydown="if(event.key==='Enter') sendFollowUp()"/>
  <button id="send-btn" onclick="sendFollowUp()">⚡</button>
</div>

<script>
var chatHistory = [];
var busy = false;

function closeCard() {
  if (window.pulseAPI) window.pulseAPI.closeAICard();
  else if (window.api) window.api.closeAICard();
}

function openPulseStock() {
  var api = window.pulseAPI || window.api;
  if (api && api.openExternal) {
    api.openExternal('https://pulsestock-nu.vercel.app');
  }
}

function showTyping() {
  document.getElementById('body').innerHTML =
    '<div class="typing"><span></span><span></span><span></span></div>';
  document.getElementById('body').classList.remove('loaded');
}

function showResponse(text) {
  busy = false;
  var btn = document.getElementById('send-btn');
  if (btn) btn.disabled = false;
  var fu = document.getElementById('followup');
  if (fu) fu.disabled = false;
  var body = document.getElementById('body');
  // Strip inline citation links — not appropriate for ticker card
  var clean = text.replace(/\[Read More\]\([^)]+\)/g, '').replace(/\n/g,'<br>');
  body.innerHTML = clean
    + '<div style="margin-top:12px;padding-top:10px;border-top:1px solid #1E2D45;">'
    + '<button onclick="openPulseStock()" '
    + 'style="background:none;border:none;color:#1A6BF5;font-size:11px;font-weight:700;cursor:pointer;padding:0;font-family:inherit;">'
    + '⚡ See Full Analysis at PulseStock →</button></div>';
  body.classList.add('loaded');
}

function sendQuestion(q) {
  if (busy || !q) return;
  busy = true;
  document.getElementById('followup').value = '';
  document.getElementById('send-btn').disabled = true;
  chatHistory.push({ role:'user', content:q });
  showTyping();

  // Check cache
  var cacheKey = 'ai_' + q.toLowerCase().replace(/[^a-z0-9]/g,'_').substring(0,60);
  try {
    var cached = JSON.parse(localStorage.getItem(cacheKey) || 'null');
    if (cached && cached.ts && Date.now() - cached.ts < 30*60*1000) {
      chatHistory.push({ role:'assistant', content:cached.text });
      showResponse(cached.text);
      busy = false;
      document.getElementById('send-btn').disabled = false;
      return;
    }
  } catch(e) {}

  fetch('https://pulsestock-nu.vercel.app/api/chat', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      system: 'You are PulseStock AI in a desktop ticker app. Give concise, direct answers — 3-4 paragraphs max. No markdown headers. Today: ' + new Date().toLocaleDateString() + '. Current time ET: ' + new Date().toLocaleTimeString('en-US',{timeZone:'America/New_York'}) + '. IMPORTANT: You have live market data provided to you — use it confidently with exact numbers. NEVER say data is unavailable. GLD, USO, TLT, TNX, SPY, QQQ, VIX and all sector ETFs are in your context — always quote their actual values. For weekly outlook questions cover: bonds/yields (TLT direction), macro theme, sector rotation with ETF percentages, commodities (GLD/USO), key catalysts, and technical picture. Use prev close when market is closed — never refuse to answer.',
      messages: chatHistory.slice(-6)
    })
  })
  .then(function(r){
    if (!r.ok) throw new Error('API error ' + r.status);
    return r.text().then(function(t){
      try { return JSON.parse(t); }
      catch(e) { throw new Error('Bad response: ' + t.substring(0,100)); }
    });
  })
  .then(function(data){
    var reply = (data.content && data.content[0] && data.content[0].text) || 'Could not get a response.';
    chatHistory.push({ role:'assistant', content:reply });
    try { localStorage.setItem(cacheKey, JSON.stringify({text:reply,ts:Date.now()})); } catch(e){}
    showResponse(reply);
    busy = false;
    document.getElementById('send-btn').disabled = false;
    document.getElementById('followup').focus();
  })
  .catch(function(e){
    showResponse('Connection error: ' + e.message);
    busy = false;
    document.getElementById('send-btn').disabled = false;
  });
}

function sendFollowUp() {
  var q = document.getElementById('followup').value.trim();
  if (!q || busy) return;
  document.getElementById('followup').value = '';
  sendQuestion(q);
}

document.addEventListener('DOMContentLoaded', function() {
  if (window.pulseAPI && window.pulseAPI.getPendingQuestion) {
    window.pulseAPI.getPendingQuestion().then(function(q) {
      if (q) sendQuestion(q);
    });
  }
});
</script>
</body>
</html>
